[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmkit"
version = "0.1.0"
description = "A unified multi-provider LLM client for Python."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "1250789832phy-dotcom" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
llmkit = "cli:main"

[tool.setuptools.packages.find]
include = ["llmkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
